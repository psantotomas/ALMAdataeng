
version: 2

models:
  - name: slv_google_sheets__budget.yml
    columns:
      - name: budget_id
        data_tests: [unique, not_null]
        
      - name: product_id
        data_tests:
        - relationships:
            arguments:
              to: ref('slv_sql_server_dbo__products')
              field: product_id

      - name: quantity_budgeted
        data_tests:
        - dbt_utils.accepted_range:
            arguments:
              min_value: 0
              inclusive: false